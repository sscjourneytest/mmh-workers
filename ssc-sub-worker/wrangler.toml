name = "mmh-attempts-ssc-sub"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Fill this in after creating the D1 database on this exam's
# Cloudflare account: wrangler d1 create mmh-attempts-ssc-sub
# (or Dashboard -> D1 -> Create Database -> copy the ID it shows)
[[d1_databases]]
binding = "DB"
database_name = "mmh-attempts-ssc-sub"
database_id = "REPLACE_WITH_DATABASE_ID"

[vars]
ALLOWED_ORIGINS = "https://mockmatrixhub.in,https://www.mockmatrixhub.in,https://mockmatrixhub.pages.dev"
